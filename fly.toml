# Fly.io, chosen for two reasons: a persistent volume (which the media
# directory needs) and a region next to the database.
#
# The Supabase project is in `aws-0-us-west-2`, so `sjc` keeps the round trip
# short. Every request reads the catalogue and the session, and that latency is
# the whole difference between a turn feeling immediate and feeling slow.
app = "plotbreak-api"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "4000"
  # Absolute URLs the client is handed: media, and the turn stream. Must be the
  # public HTTPS origin, or the phone is told to fetch from localhost.
  PUBLIC_BASE_URL = "https://plotbreak-api.fly.dev"
  ASSET_ROOT = "/data/assets"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # One machine, because generated media is written to a local volume and a
  # second machine would not see the first one's art. Raising this means moving
  # media to object storage first — see docs/deploy.md.
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 80
    hard_limit = 150

# A turn is a long request: the model writes prose while the client holds an
# SSE stream open. The default grace is far too short for that.
[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[mounts]]
  source = "plotbreak_media"
  destination = "/data"

[[vm]]
  # The catalogue cache holds ~1.1 MB of parsed worlds and the turn pipeline is
  # I/O bound on the model, not CPU.
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
